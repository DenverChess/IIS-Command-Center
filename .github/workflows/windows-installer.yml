name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - "iis_sentinel/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "iis_sentinel/**"
      - "installer/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

env:
  # Last release that registered the service from the install root; upgrades from it must keep working.
  LEGACY_REF: f024152

jobs:
  build-and-test:
    name: ${{ matrix.os }}${{ matrix.legacy && ' (upgrade from legacy layout)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022   # Windows 10 / Server 2022 code base
            legacy: false
          - os: windows-2025   # Windows 11 24H2 / Server 2025 code base
            legacy: false
          - os: windows-2025
            legacy: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: installer/build/cache
          key: installer-cache-${{ hashFiles('installer/build.ps1') }}

      - name: Build installer
        run: .\installer\build.ps1 -Version 2.0.0

      - name: Build legacy installer
        if: matrix.legacy
        run: |
          git worktree add "$env:RUNNER_TEMP\legacy" $env:LEGACY_REF
          & "$env:RUNNER_TEMP\legacy\installer\build.ps1" -Version 1.9.9 -OutputDir "$env:RUNNER_TEMP\legacy-dist"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload installer
        if: ${{ !matrix.legacy && matrix.os == 'windows-2022' }}
        uses: actions/upload-artifact@v4
        with:
          name: IISSentinel-Setup
          path: |
            dist/IISSentinel-Setup-*.exe
            dist/IISSentinel-Setup-*.exe.sha256

      - name: End-to-end test (IIS + WinRM + SMB + install/upgrade/uninstall)
        run: |
          $e2e = @{
            Installer   = (Get-ChildItem dist\IISSentinel-Setup-*.exe | Select-Object -First 1).FullName
            ArtifactDir = "$env:RUNNER_TEMP\e2e"
          }
          if ("${{ matrix.legacy }}" -eq "true") {
            $e2e.LegacyInstaller = (Get-ChildItem "$env:RUNNER_TEMP\legacy-dist\IISSentinel-Setup-*.exe" | Select-Object -First 1).FullName
          }
          .\installer\tests\e2e.ps1 @e2e

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}${{ matrix.legacy && '-legacy' || '' }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
